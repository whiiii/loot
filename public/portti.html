<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Loot</title>
<link rel="stylesheet" href="/staattinen/tyyli.css">
</head>
<body>
<div class="keskita">
  <form class="kortti" id="lomake" autocomplete="off">
    <h1>Loot</h1>
    <p class="selite">Sivusto on killan käytössä. Anna yhteinen tunnus.</p>

    <label for="tunnus">Tunnus</label>
    <input type="text" id="tunnus" name="tunnus" required autofocus>

    <label for="salasana">Salasana</label>
    <input type="password" id="salasana" name="salasana" required>

    <button type="submit" id="nappi">Jatka</button>
    <div class="viesti" id="viesti"></div>
  </form>
</div>

<script>
const lomake  = document.getElementById("lomake");
const nappi   = document.getElementById("nappi");
const viesti  = document.getElementById("viesti");

lomake.addEventListener("submit", async (e) => {
  e.preventDefault();
  nappi.disabled = true;
  viesti.textContent = "";
  viesti.className = "viesti";

  try {
    const vastaus = await fetch("/api/portti", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({
        username: document.getElementById("tunnus").value,
        password: document.getElementById("salasana").value
      })
    });
    const data = await vastaus.json();

    if (data.ok) {
      location.href = "/";
      return;
    }
    viesti.textContent = data.error || "Kirjautuminen ei onnistunut.";
  } catch (err) {
    viesti.textContent = "Yhteysvirhe. Yritä uudelleen.";
  }
  nappi.disabled = false;
});
</script>
</body>
</html>
