<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Ylläpito — Loot</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/staattinen/favicon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono&display=swap">
<link rel="stylesheet" href="/staattinen/tyyli.css">
<link rel="stylesheet" href="/staattinen/hahmo.css">
<link rel="stylesheet" href="/staattinen/yllapito.css">
<link rel="stylesheet" href="/staattinen/dialogi.css">
</head>
<body class="sivu">

<header class="palkki">
  <div>
    <strong>Ylläpito</strong>
    <span class="himmea" id="raidi"></span>
  </div>
  <div class="palkki-oikea">
    <a class="pieni linkkinappi" href="/siirto">Siirto</a>
    <a class="pieni linkkinappi" href="/historia">Tuontihistoria</a>
    <a class="pieni linkkinappi" href="/loki">Loki</a>
    <a class="pieni linkkinappi" href="/profiili">Oma profiili</a>
    <button class="pieni" id="ulos">Kirjaudu ulos</button>
  </div>
</header>

<main class="yllapito">

  <section>
    <h2>Profiilit</h2>

    <!-- Ylläpitotunnus ei ole profiili, joten se ei ole listassa vaan
         omalla rivillään sen yläpuolella. Tavallinen tekstikappale eikä
         oma asettelu: sivun omat luokat toimivat, omani eivät. -->
    <p id="yllapitotieto" class="pieni-teksti" hidden></p>
    <div id="yllapitonapit" class="napit" hidden></div>

    <table class="lista">
      <thead>
        <tr>
          <th data-lajittele="username">Tunnus</th>
          <th data-lajittele="hahmo">Hahmo</th>
          <th data-lajittele="class">Luokka</th>
          <th data-lajittele="raid_role">Rooli</th>
          <th data-lajittele="role">Rank</th>
          <th data-lajittele="valintoja" class="oikealle">Valinnat</th>
          <th data-lajittele="saatuja" class="oikealle">Saatu</th>
          <th data-lajittele="locked">Tila</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="kayttajat">
        <tr><td colspan="9" class="himmea">Ladataan…</td></tr>
      </tbody>
    </table>
  </section>

  <section>
    <h2>Uusi jäsen</h2>
    <form class="lomake" id="uusi" autocomplete="off">
      <div class="kentta">
        <label for="u-tunnus">Tunnus</label>
        <input type="text" id="u-tunnus" required maxlength="20"
               placeholder="kirjautumistunnus">
      </div>
      <div class="kentta">
        <label for="u-etunimi">Etunimi</label>
        <input type="text" id="u-etunimi" maxlength="40">
      </div>
      <div class="kentta">
        <label for="u-sukunimi">Sukunimi</label>
        <input type="text" id="u-sukunimi" maxlength="40">
      </div>
      <div class="kentta kapea">
        <label for="u-luokka">Luokka</label>
        <select id="u-luokka" class="roolivalinta"></select>
      </div>
      <div class="kentta kapea">
        <label for="u-raidirooli">Rooli</label>
        <select id="u-raidirooli" class="roolivalinta"></select>
      </div>
      <div class="kentta kapea">
        <label for="u-rooli">Rank</label>
        <select id="u-rooli" class="roolivalinta">
          <option value="social">Social</option>
          <option value="raider" selected>Raider</option>
          <option value="officer">Officer</option>
        </select>
      </div>
      <div class="kentta kapea">
        <label for="u-salasana">Salasana</label>
        <input type="text" id="u-salasana" required minlength="6"
               placeholder="väh. 6 merkkiä">
      </div>
      <div class="kentta nappirivi">
        <button type="submit" class="nappi-ensisijainen">Luo jäsen</button>
      </div>
    </form>
  </section>

  <section>
    <p class="pieni-teksti himmea">
      Vienti addoniin ja tuonti addonista ovat omalla
      <a href="/siirto">Siirto</a>-sivullaan.
    </p>
  </section>

</main>

<div class="viesti" id="viesti"></div>

<script src="/staattinen/hahmotiedot.js"></script>
<script src="/staattinen/dialogi.js"></script>
<script src="/staattinen/yllapito.js"></script>
</body>
</html>
