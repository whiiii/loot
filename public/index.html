<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loot</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: #14100c; color: #e8e0d4;
    font: 15px/1.6 system-ui, -apple-system, Segoe UI, sans-serif;
  }
  main { text-align: center; padding: 2rem; }
  h1 { font-size: 1.5rem; margin: 0 0 .25rem; font-weight: 650; letter-spacing: .01em; }
  p.sub { margin: 0 0 1.75rem; color: #9b9183; font-size: .9rem; }
  #tila {
    display: inline-block; padding: .55rem 1.1rem; border-radius: 8px;
    border: 1px solid #3a3228; background: #1c1812;
    font-size: .88rem; color: #9b9183;
  }
  #tila.ok    { border-color: #4a6b3a; color: #9ad17a; background: #18200f; }
  #tila.virhe { border-color: #7a3b3b; color: #e08c8c; background: #231111; }
</style>
</head>
<body>
  <main>
    <h1>Loot</h1>
    <p class="sub">Raid-lootin priorisointi</p>
    <div id="tila">Tarkistetaan yhteyttä…</div>
  </main>

<script>
// Ainoa tehtävä tässä vaiheessa: näyttää toimiiko ketju selaimesta
// Workerin kautta tietokantaan asti.
fetch("/api/health")
  .then(r => r.json())
  .then(d => {
    const el = document.getElementById("tila");
    if (d.ok) {
      el.textContent = "Yhteys tietokantaan toimii (skeema v" + d.schema_version + ")";
      el.className = "ok";
    } else {
      el.textContent = "Tietokantavirhe: " + d.error;
      el.className = "virhe";
    }
  })
  .catch(e => {
    const el = document.getElementById("tila");
    el.textContent = "Ei yhteyttä rajapintaan: " + e;
    el.className = "virhe";
  });
</script>
</body>
</html>
