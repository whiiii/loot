<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Profiili — Loot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono&display=swap">
<link rel="stylesheet" href="/staattinen/tyyli.css">
<link rel="stylesheet" href="/staattinen/hahmo.css">
<link rel="stylesheet" href="/staattinen/dialogi.css">
</head>
<body class="sivu">

<header class="palkki">
  <div></div>
  <div class="palkki-oikea">
    <span class="himmea" id="raidi"></span>
    <a class="pieni linkkinappi" id="yllapitolinkki" href="/yllapito" hidden>Ylläpito</a>
    <button class="pieni" id="tallenna">Tallenna</button>
    <button class="pieni" id="ulos">Kirjaudu ulos</button>
  </div>
</header>

<div id="lukkoilmoitus" class="ilmoitus" hidden>
  Profiilisi on lukittu. Valintoja ei voi muuttaa — pyydä officeria avaamaan lukko.
</div>

<div id="katseluilmoitus" class="ilmoitus katselu" hidden>
  <!-- Lause yhden elementin sisassa. Ilman sita jokainen sana on oma
       asettelualkio ja ne levittyvat palkin leveydelle. -->
  <span>Katselet jäsenen <strong id="katseltava"></strong> profiilia</span>
  <a href="/yllapito">← Takaisin ylläpitoon</a>
</div>

<main class="hahmo">
  <div class="sarake vasen" id="vasen"></div>
  <div class="keski">
    <div class="hahmo-otsikko">
      <strong id="nimi">…</strong>
      <span id="rooli"></span>
    </div>
    <img id="hahmokuva" src="/staattinen/hahmo.png" alt="">
    <div class="keski-tyhja" id="keski-tyhja" hidden>Hahmo</div>
  </div>
  <div class="sarake oikea" id="oikea"></div>
  <div class="ala" id="ala"></div>
</main>

<!-- Itemin valinta -->
<div class="peite" id="peite" hidden>
  <div class="valitsin">
    <div class="valitsin-ylaosa">
      <strong id="valitsin-otsikko"></strong>
      <button class="pieni" id="sulje">Sulje</button>
    </div>
    <div class="valitsin-lista" id="valitsin-lista"></div>
    <button class="pieni leveä" id="tyhjenna">Poista valinta</button>
  </div>
</div>

<!-- Tooltip. Yksi elementti jota siirretaan hiiren mukana. -->
<div id="tooltip" class="wh-tooltip" hidden></div>

<div class="viesti" id="viesti"></div>

<script src="/staattinen/hahmotiedot.js"></script>
<script src="/staattinen/dialogi.js"></script>
<script src="/staattinen/hahmo.js"></script>
</body>
</html>
