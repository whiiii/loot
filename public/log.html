<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Loki — Loot</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/static/favicon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono&display=swap">
<link rel="stylesheet" href="/static/style.css">
<link rel="stylesheet" href="/static/profile.css">
<link rel="stylesheet" href="/static/admin.css">
<link rel="stylesheet" href="/static/dialog.css">
</head>
<body class="page">

<header class="topbar">
  <div class="topbar-left">
    <strong>Loki</strong>
    <span class="dim" id="summary"></span>
  </div>
  <nav class="topbar-right nav">
    <a class="small linkbutton" data-officer href="/admin">Ylläpito</a>
    <a class="small linkbutton" data-officer href="/transfer">Siirto</a>
    <a class="small linkbutton" data-officer href="/imports">Tuontihistoria</a>
    <a class="small linkbutton" data-officer href="/log">Loki</a>
    <a class="small linkbutton" href="/profile">Oma profiili</a>
    <button class="small" id="logout">Kirjaudu ulos</button>
  </nav>
</header>

<main class="admin">

  <section>
    <h2>Toimintoloki</h2>
    <p class="small-text dim">
      Kuka teki, mitä, kenelle ja milloin. Officer näkee lokin, mutta ei voi
      muuttaa sitä: loki, jonka kohde voi siivota, ei ole loki.
      Lukon avaaminen vaatii syyn, ja syy näkyy tässä.
    </p>

    <div class="buttons" style="margin-bottom:.9rem">
      <select id="filter" class="select">
        <option value="">Kaikki toiminnot</option>
      </select>
      <input type="text" id="search" class="import-label" maxlength="40"
             placeholder="Suodata nimellä (tekijä tai kohde)">
      <button class="small" id="clear-search">Tyhjennä</button>
    </div>

    <div class="table-wrap">
    <table class="table">
      <thead>
        <tr>
          <th>Aika</th>
          <th>Tekijä</th>
          <th>Toiminto</th>
          <th>Kohde</th>
          <th>Lisätiedot</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="log">
        <tr><td colspan="6" class="dim">Ladataan…</td></tr>
      </tbody>
    </table>
    </div>
  </section>

</main>

<div class="message" id="message"></div>

<script src="/static/nav.js"></script>
<script src="/static/dialog.js"></script>
<script src="/static/log.js"></script>
</body>
</html>
